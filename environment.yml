name: geoai-mineral

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12
  - pip
  - pre-commit=4.6.*
  - numpy=2.5.*
  - pandas=3.0.*
  - geopandas-base=1.1.*
  - shapely=2.1.*
  - pyproj=3.8.*
  - pyogrio=0.13.*
  - rasterio=1.5.*
  - matplotlib-base=3.11.*
  - ipykernel=7.3.*
  - nbformat=5.*
  - nbclient=0.10.*
  - pytest=9.1.*
