[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "geoai-mineral-labs"
version = "0.1.0"
description = "Reproducible GeoAI laboratories for mineral exploration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []


[tool.setuptools.packages.find]
where = ["src"]
include = ["geoai*"]
